name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build HACS archive
        run: |
          cd custom_components/momcozy_baby_monitor
          zip -r ../../momcozy_baby_monitor.zip . \
            -x '*/__pycache__/*' '*.pyc' 'vendor/*'
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          momcozy_baby_monitor.zip
          --generate-notes
          --verify-tag
